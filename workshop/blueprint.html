<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Blueprint</title>
<!--
  The Harness Blueprint, filled in section by section. Open it straight from the folder (no server needed):
      start workshop/blueprint.html          (Windows; macOS: open, Linux: xdg-open)
  The buttons on top follow the day. After each section's Blueprint slide, press that section: its boxes fill in
  with what we wrote for tinystream, the new ones light up. Section 5 shows the whole Blueprint.
  Keys: 0 = start (empty), 1 2 3 4 5 6 = Sections 1, 2, 3, 4a, 4b, 5; left/right arrows step; f = full screen.
  The step is kept in the address (#s3), so a reload keeps it.
-->
<style>
@font-face { font-family: "Hanken Grotesk"; font-weight: 400; src: url("../console/web/fonts/HankenGrotesk-400-Latin.woff2") format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-weight: 500; src: url("../console/web/fonts/HankenGrotesk-500-Latin.woff2") format("woff2"); }

:root {
  --bg: #0b0b26;
  --surface: #13133c;
  --surface-2: #1b1b4a;
  --line: #2a2956;
  --ink: #fefbe6;
  --ink-2: #aba9a5;
  --accent: #9795ff;
  --accent-bg: #23235c;
  --sans: "Bagoss Standard Light", "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans);
  display: flex; flex-direction: column; gap: 22px; padding: 28px 36px 32px; min-height: 100vh;
}
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.eyebrow { font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 { font-size: 40px; font-weight: 500; margin: 0; }
.status { font-size: 20px; color: var(--ink-2); margin: 0; }
.status b { color: var(--ink); font-weight: 500; }

nav { display: flex; gap: 10px; flex-wrap: wrap; }
nav button {
  font: inherit; font-size: 20px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 10px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px;
}
nav button .n {
  display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; padding: 0 6px;
  border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font-size: 17px; font-weight: 500;
}
nav button.done { color: var(--ink); border-color: var(--accent); }
nav button.done .n { background: var(--accent); color: var(--bg); }
nav button.current { background: var(--accent-bg); }
nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.part {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
  display: flex; flex-direction: column; gap: 14px; transition: border-color .4s;
}
.part.reached { border-color: var(--accent); }
.part .sec { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
.part.reached .sec { color: var(--accent); }
.part h2 { font-size: 26px; font-weight: 500; margin: 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

.box { border-radius: 12px; padding: 14px; border: 1px dashed var(--line); display: flex; flex-direction: column; gap: 8px; flex: 1; transition: background .5s, border-color .5s; }
.box .head { display: flex; align-items: center; gap: 10px; }
.box .num {
  flex: none; width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 500; background: var(--surface-2); color: var(--ink-2);
}
.box .name { font-size: 20px; font-weight: 500; color: var(--ink-2); }
.box .q { font-size: 16px; color: var(--ink-2); margin: 0; font-style: italic; }
.box .a { font-size: 17px; line-height: 1.35; margin: 0; color: var(--ink); opacity: 0; max-height: 0; overflow: hidden; transition: opacity .6s, max-height .6s; }
.box .a + .a { margin-top: 2px; }
.box .a b { color: var(--accent); font-weight: 500; }
.box.filled { border-style: solid; border-color: var(--line); background: var(--surface-2); }
.box.filled .num { background: var(--accent); color: var(--bg); }
.box.filled .name { color: var(--ink); }
.box.filled .a { opacity: 1; max-height: 400px; }
.box.new { border-color: var(--accent); background: var(--accent-bg); }

footer { font-size: 18px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
kbd { font-family: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; color: var(--ink); }

@media (max-width: 1200px) { main { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) {
  body { padding: 16px; }
  main { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 30px; }
}
</style>
</head>
<body>
<header>
  <div>
    <p class="eyebrow">Harness Blueprint · tinystream</p>
    <h1>Thirteen boxes, six parts</h1>
  </div>
  <p class="status" id="status"></p>
</header>
<nav id="steps" aria-label="Workshop sections"></nav>
<main id="parts"></main>
<footer>
  <span>Keys: <kbd>0</kbd> start · <kbd>1</kbd>–<kbd>6</kbd> sections · <kbd>←</kbd> <kbd>→</kbd> step · <kbd>f</kbd> full screen</span>
  <span>The blank sheet has the same questions. Fill it in for one task of your own team.</span>
</footer>
<script>
"use strict";
// Steps of the day: the key, the label, and which part each step fills. Step 0 is the empty sheet of the kick-off.
const STEPS = [
  { key: "0", label: "Kick-off", short: "Start" },
  { key: "1", label: "Section 1", short: "1" },
  { key: "2", label: "Section 2", short: "2" },
  { key: "3", label: "Section 3", short: "3" },
  { key: "4", label: "Section 4a", short: "4a" },
  { key: "5", label: "Section 4b", short: "4b" },
  { key: "6", label: "Section 5", short: "5" },
];
// The six parts and their boxes, as on the printed sheet. Box numbers follow the sheet, not the order of the day.
// The answers are what we wrote for tinystream (the Blueprint slides of the deck).
const PARTS = [
  { step: 1, sec: "Section 1", name: "Inputs", boxes: [
    { n: 1, name: "Task spec", q: "What does done look like, and which check proves it?",
      a: ["A ticket with expected and actual in numbers, and the names of the tests that must pass."] },
    { n: 2, name: "Context", q: "What does the agent read every time?",
      a: ["AGENTS.md on every call, C rules per file type, and PROTOCOL.md as the source of truth."] },
    { n: 3, name: "Reusable prompts", q: "Which instructions repeat?",
      a: ["One prompt per role, and templates for plan, implement, review and retry."] } ] },
  { step: 2, sec: "Section 2", name: "Checks", boxes: [
    { n: 6, name: "Verification gates", q: "Which checks with no model in them decide?",
      a: ["Fourteen gates, the ones without a build first, among them compliance, style, comments, diff-policy, build, MISRA subset, unit tests, sanitizers and budgets."] },
    { n: 7, name: "Iteration loop", q: "How many tries, and what does the agent get back?",
      a: ["Three retries. At most six feedback items, each with gate, file, line and message. Then it escalates to a person."] } ] },
  { step: 3, sec: "Section 3", name: "Limits", boxes: [
    { n: 4, name: "Roles", q: "Who does what, and what may each one touch?",
      a: ["Planner, implementer, test-writer, reviewer, each with its own tools and write scope."] },
    { n: 5, name: "Orchestration", q: "Which steps, in which order?",
      a: ["Plan, implement, tests, gates, review, commit. A reject goes back twice at most."] },
    { n: 8, name: "Guardrails", q: "What must never be touched or run?",
      a: ["Protected paths, forbidden calls, a shell deny list. Ticket text is data."] },
    { n: 9, name: "Compliance and audit", q: "What is on record afterwards?",
      a: ["Every prompt, tool call, gate result and credit, in the run folder."] } ] },
  { step: 4, sec: "Section 4a", name: "Humans", boxes: [
    { n: 10, name: "Autonomy", q: "Which step needs a person?",
      a: ["A person approves the plan and the merge. A flagged ticket stops and waits. Everything else runs alone, with a cap."] } ] },
  { step: 5, sec: "Section 4b", name: "Evidence", boxes: [
    { n: 11, name: "Evals", q: "What is the eval set?",
      a: ["Three hard tickets, held-back tests, repeated runs, one leaderboard."] },
    { n: 12, name: "Cost", q: "What may a run cost, and how do we compare?",
      a: ["A cap on every run. Variants are compared by credits per pass, not per run."] } ] },
  { step: 6, sec: "Section 5", name: "Team", boxes: [
    { n: 13, name: "Team workflow", q: "Who starts it, who owns it, can a colleague run it?",
      a: ["<b>Trigger:</b> a label on an issue starts the run. A Jira status or a CI job can do the same.",
          "<b>Owner:</b> one named person changes the harness, reads the failures and holds the budget.",
          "<b>Guide:</b> one page: what it does, how to run it, what to expect, what to do when it fails. Tested by a handover."] } ] },
];

const $steps = document.getElementById("steps");
const $parts = document.getElementById("parts");
const $status = document.getElementById("status");
const boxEls = [];   // [{ step, el }]
const partEls = [];  // [{ step, el }]

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const rich = (s) => esc(s).replace(/&lt;b&gt;(.*?)&lt;\/b&gt;/g, "<b>$1</b>");   // only <b> survives

STEPS.forEach((s, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.innerHTML = `<span class="n">${esc(s.short)}</span>${esc(s.label)}`;
  b.title = `${s.label} (key ${s.key})`;
  b.addEventListener("click", () => go(i));
  $steps.appendChild(b);
});

PARTS.forEach((part) => {
  const el = document.createElement("section");
  el.className = "part";
  el.innerHTML = `<p class="sec">${esc(part.sec)}</p><h2>${esc(part.name)}</h2>`;
  part.boxes.forEach((bx) => {
    const d = document.createElement("div");
    d.className = "box";
    d.innerHTML = `<div class="head"><span class="num">${bx.n}</span><span class="name">${esc(bx.name)}</span></div>`
      + `<p class="q">${esc(bx.q)}</p>` + bx.a.map((a) => `<p class="a">${rich(a)}</p>`).join("");
    el.appendChild(d);
    boxEls.push({ step: part.step, el: d });
  });
  $parts.appendChild(el);
  partEls.push({ step: part.step, el });
});

let current = -1;
function go(i) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  const prev = current;
  current = i;
  [...$steps.children].forEach((b, k) => {
    b.classList.toggle("done", k > 0 && k <= i);
    b.classList.toggle("current", k === i);
    b.setAttribute("aria-pressed", k === i ? "true" : "false");
  });
  boxEls.forEach(({ step, el }) => {
    el.classList.toggle("filled", step <= i);
    el.classList.toggle("new", prev !== -1 && step > prev && step <= i);
  });
  partEls.forEach(({ step, el }) => el.classList.toggle("reached", step <= i));
  const filled = boxEls.filter((b) => b.step <= i).length;
  $status.innerHTML = i === 0
    ? "Empty sheet: <b>0 of 13</b> boxes"
    : i === STEPS.length - 1
      ? "The whole harness: <b>13 of 13</b> boxes"
      : `After ${esc(STEPS[i].label)}: <b>${filled} of 13</b> boxes`;
  const hash = "#s" + i;
  if (location.hash !== hash) history.replaceState(null, "", hash);
}

document.addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = STEPS.findIndex((s) => s.key === e.key);
  if (k >= 0) { go(k); return; }
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(current + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(current - 1); }
  else if (e.key === "f") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
});

const m = /^#s(\d)$/.exec(location.hash);
go(m ? Number(m[1]) : 0);
</script>
</body>
</html>
